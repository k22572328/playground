name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Build Linux amd64 binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p release dist
          go build -trimpath -ldflags='-s -w' -o release/playground ./cmd/server

      - name: Package release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cp README.md release/
          printf '%s\n' "$RELEASE_TAG" > release/VERSION
          printf '%s\n' "$RELEASE_COMMIT" > release/COMMIT
          tar -czf dist/playground-linux-amd64.tar.gz -C release .
          cd dist
          sha256sum playground-linux-amd64.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            dist/playground-linux-amd64.tar.gz dist/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
